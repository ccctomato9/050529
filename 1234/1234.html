<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>AR 骨頭介紹</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

.info-card {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 360px;
  max-height: 60vh;
  overflow-y: auto;
  background: rgba(255,255,255,0.95);
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  display: none;
}

.info-card h2 {
  margin: 0;
  font-size: 18px;
  color: #2b6cb0;
}

.info-card p {
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-line;
}
</style>
</head>

<body>

<div class="info-card" id="infoCard">
  <h2 id="title"></h2>
  <p id="desc"></p>
</div>

<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: true;"
vr-mode-ui="enabled: false"
>

<a-assets>
  <img id="bone1" src="images/bone1.jpg" />
  <img id="bone2" src="images/bone2.jpg" />
  <img id="bone3" src="images/bone3.jpg" />
  <img id="bone4" src="images/bone4.jpg" />
  <img id="bone5" src="images/bone5.jpg" />
  <img id="bone6" src="images/bone6.jpg" />
  <img id="bone7" src="images/bone7.jpg" />
  <img id="bone8" src="images/bone8.jpg" />
  <img id="bone9" src="images/bone9.jpg" />
  <img id="miniBone" src="images/mini-bone.png" />
</a-assets>

<a-light type="ambient" intensity="2"></a-light>
<a-camera look-controls="enabled: false"></a-camera>

<!-- 0 -->
<a-entity mindar-image-target="targetIndex: 0">
  <a-plane src="#bone1" width="1" height="1.2"></a-plane>
  <a-image src="#miniBone" width="0.18" height="0.18"
    position="0.7 0.4 0" float-bone></a-image>
</a-entity>

<!-- 1 -->
<a-entity mindar-image-target="targetIndex: 1">
  <a-plane src="#bone2" width="1" height="1.2"></a-plane>
  <a-image src="#miniBone" width="0.18" height="0.18"
    position="0.6 0.4 0" float-bone></a-image>
</a-entity>

<!-- 2 -->
<a-entity mindar-image-target="targetIndex: 2">
  <a-plane src="#bone3" width="1" height="1.2"></a-plane>
  <a-image src="#miniBone" width="0.18" height="0.18"
    position="-0.6 0.3 0" float-bone></a-image>
</a-entity>

<!-- 3 -->
<a-entity mindar-image-target="targetIndex: 3">
  <a-plane src="#bone4" width="1" height="1.2"></a-plane>
  <a-image src="#miniBone" width="0.18" height="0.18"
    position="0.6 0.3 0" float-bone></a-image>
</a-entity>

<!-- 4 -->
<a-entity mindar-image-target="targetIndex: 4">
  <a-plane src="#bone5" width="1" height="1.2"></a-plane>
  <a-image src="#miniBone" width="0.18" height="0.18"
    position="-0.6 0.3 0" float-bone></a-image>
</a-entity>

<!-- 5 -->
<a-entity mindar-image-target="targetIndex: 5">
  <a-plane src="#bone6" width="1" height="1.2"></a-plane>
  <a-image src="#miniBone" width="0.18" height="0.18"
    position="0.6 0.3 0" float-bone></a-image>
</a-entity>

<!-- 6 -->
<a-entity mindar-image-target="targetIndex: 6">
  <a-plane src="#bone7" width="1" height="1.2"></a-plane>
  <a-image src="#miniBone" width="0.18" height="0.18"
    position="-0.6 0.3 0" float-bone></a-image>
</a-entity>

<!-- 7 -->
<a-entity mindar-image-target="targetIndex: 7">
  <a-plane src="#bone8" width="1" height="1.2"></a-plane>
  <a-image src="#miniBone" width="0.18" height="0.18"
    position="0.6 0.3 0" float-bone></a-image>
</a-entity>

<!-- 8 -->
<a-entity mindar-image-target="targetIndex: 8">
  <a-plane src="#bone9" width="1" height="1.2"></a-plane>
  <a-image src="#miniBone" width="0.18" height="0.18"
    position="-0.6 0.3 0" float-bone></a-image>
</a-entity>

</a-scene>

<script>

/* 主漂浮 */
AFRAME.registerComponent('float', {
  init: function () {
    this.startY = this.el.object3D.position.y;
  },
  tick: function (t) {
    this.el.object3D.position.y =
      this.startY + Math.sin(t / 600) * 0.03;
  }
});

/* 小骨頭漂浮 */
AFRAME.registerComponent('float-bone', {
  init: function () {
    this.startY = this.el.object3D.position.y;
  },
  tick: function (t) {
    this.el.object3D.position.y =
      this.startY + Math.sin(t / 500) * 0.05;

    this.el.object3D.rotation.z += 0.01;
  }
});
const bones = [
{
title: "頭骨",
desc: `人類頭骨通常由22塊骨頭組成。除了下頜骨，骨頭間是由骨縫連接，只允許微量的運動。
8塊骨頭組成腦顱，容納並保護整個腦部，包括大腦和腦幹（即中腦、小腦，腦橋和延髓）；
14塊骨頭組成面顱，支撐面部並形成面部輪廓；顳骨包住中耳的6塊聽小骨。`
},
{
title: "肩胛骨",
desc: `肩胛骨（scapula）位於胸廓背部，是組成胸帶的三塊骨骼之一，在第2至第7肋骨的高度，為一大的三角形扁平骨。動物的肩胛骨也叫扇骨。
他們的內側緣離脊柱約5公分。`
},
{
title: "椎骨",
desc: `椎骨（英語：vertebra）又稱脊椎骨、脊椎，是組成脊椎動物脊柱的不規則骨，屬於構成中軸骨核心的主要骨骼系統結構構件，成年後可作為主要的造血組織。典型椎骨包括椎體、椎弓、棘突和橫突、關節突等部分。
依動物種類不同，椎骨可為硬骨或軟骨。哺乳動物則根據椎骨所在部位不同分為頸椎、胸椎、腰椎、薦椎、尾椎等。`
},
{
title: "肱骨",
desc: `肱骨（humerus）是肩到肘的長骨，是上臂的一部分。它將肩胛骨和前臂的橈骨和尺骨連接起來。肱骨由三部分組成。肱骨上端包括一個球型部分、一個較窄的頸部及兩個小突起，分別稱為大結節、小結節。肱骨幹上半部為圓柱形，下半部則較似稜柱。肱骨下端包含兩個上髁、兩個突起（肱骨滑車和肱骨小頭）及三個窩（冠狀窩、橈骨窩和鷹嘴窩）。`
},
{
title: "胸骨&肋骨",
desc: `胸骨（Sternum）是胸廓前方一塊長形扁平，領帶狀骨，接有肋 。
肋骨（英語：rib）是胸廓中的枝狀骨，呈細長呈弓形的扁骨，在背部與相應的胸椎相連，由後上方向前下方傾斜，在人體有12對。動物的頭側肋骨藉由肋軟骨與胸骨相連，尾側肋骨一般不與胸骨相連。肋則包括肋骨（ribs）和肋軟骨（costal cartilages）。`
},
{
title: "掌骨&指骨",
desc: `掌骨是手部骨骼中間的部份，連接在近端手指及腕骨之間，而腕骨再與前臂連結。
指骨（英語：phalanges of fingers）共14塊，均為長骨。拇指僅有兩節指骨；第二至五指各有三節指骨。`
},
{
title: "髖骨",
desc: `髖骨（hip bone）又稱胯骨、髀骨，為人體腰部至臀部的大型骨骼，共左右兩塊。
幼年時，髖骨分為髂骨、坐骨和恥骨以及軟骨連接。
成年後，它們之間的軟骨會骨化，成為一個整體，即髖骨。`
},
{
title: "股骨",
desc: `股骨（femur）俗稱大腿骨，是人體中最長、最大的管狀骨。
股骨頭與骨盆形成髖關節。`
},
{
title: "足部",
desc: `跗骨（Tarsus）由跗骨、蹠骨與趾骨組成。
負責行走與平衡。`
}
];

/* AR事件 */
document.querySelectorAll("[mindar-image-target]").forEach((el, i) => {

el.addEventListener("targetFound", () => {
  document.getElementById("infoCard").style.display = "block";
  document.getElementById("title").innerText = bones[i].title;
  document.getElementById("desc").innerText = bones[i].desc;
});

el.addEventListener("targetLost", () => {
  document.getElementById("infoCard").style.display = "none";
});

});

</script>

</body>
</html>
