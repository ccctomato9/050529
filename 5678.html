<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>AR 骨頭介紹</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* 資訊卡片樣式：確保浮動在 AR 相機畫面最上層 */
.info-card {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 360px;
  max-height: 60vh;
  overflow-y: auto;
  background: rgba(0, 0, 0, 0.85); /* 深色背景提高文字識別度 */
  border-radius: 18px;
  padding: 16px;
  display: none;                 /* 預設隱藏，待掃描成功後由 JS 觸發顯示 */
  z-index: 99999 !important;     /* 最高權限層級，防止被 WebGL 畫布覆蓋 */
  pointer-events: auto;          /* 允許使用者點擊與滾動卡片 */
  box-sizing: border-box;
}

.info-card h2 {
  margin: 0 0 8px 0;
  font-size: 18px;
  color: #ffffff;
}

.info-card p {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-line;
  color: #e0e0e0;
}
</style>

<script>
/* 骨頭資料庫（完整保留你的文字內容） */
const bones = [
  {
    title: "頭骨",
    desc: `人類頭骨通常由22塊骨頭組成。除了下頜骨，骨頭間是由骨縫連接，只允許微量的運動。8塊骨頭組成腦顱，容納並保護整個腦部，包括大腦和腦幹（即中腦、小腦，腦橋和延髓）；\n14塊骨頭組成面顱，支撐面部並形成面部輪廓；顳骨包住中耳的6塊聽小骨。`
  },
  {
    title: "肩胛骨",
    desc: `肩胛骨位於胸廓背部，是三角形扁平骨。位於第2至第7肋骨高度，內側緣距脊柱約5公分。`
  },
  {
    title: "椎骨",
    desc: `椎骨（英語：vertebra）又稱脊椎骨、脊椎，是組成脊椎動物脊柱的不規則骨，\n屬於構成中軸骨核心的主要骨骼系統結構構件，成年後可作為主要的造血組織。典型椎骨包括椎體、椎弓、棘突和橫突、關節突等部分。\n依動物種類不同，椎骨可為硬骨或軟骨。哺乳動物則根據椎骨所在部位不同分為頸椎、胸椎、腰椎、薦椎、尾椎等。`
  },
  {
    title: "肱骨",
    desc: `肱骨（humerus）是肩到肘的長骨，是上臂的一部分。它將肩胛骨和前臂的橈骨和尺骨連接起來。\n肱骨由三部分組成。肱骨上端包括一個球型部分、一個較窄的頸部及兩個小突起，分別稱為大結節、小結節。\n肱骨幹上半部為圓柱形，下半部則較似稜柱。肱骨下端包含兩個上髁、兩個突起（肱骨滑車和肱骨小頭）及三個窩（冠狀窩、橈骨窩和鷹嘴窩）。`
  },
  {
    title: "胸骨&肋骨",
    desc: `胸骨（Sternum）是胸廓前方一塊長形扁平，領帶狀骨，接有肋 。\n肋骨（英語：rib）是胸廓中的枝狀骨，呈細長呈弓形的扁骨，在背部與相應的胸椎相連，由後上方向前下方傾斜，\n在人體有12對。動物的頭側肋骨藉由肋軟骨與胸骨相連，尾側肋骨一般不與胸骨相連。肋則包括肋骨（ribs）和肋軟骨（costal cartilages）。`
  },
  {
    title: "掌骨&指骨",
    desc: `掌骨是手部骨骼中間的部份，連接在近端手指及腕骨之間，而腕骨再與前臂連結。\n指骨（英語：phalanges of fingers）共14塊，均為長骨。\n拇指僅有兩節指骨；第二至五指各有三節指骨。各指的指骨由近側至遠側依次叫近節指骨、中節指骨、遠節指骨。`
  },
  {
    title: "髖骨",
    desc: `髖骨（hip bone）又稱胯骨、髀骨，為人體腰部至臀部的大型骨骼，共左右兩塊。\n幼年時，髖骨分為髂骨、坐骨和恥骨以及軟骨連接。\n成年後，它們之間的軟骨會骨化，成為一個整體，即髖骨。左髖骨、右髖骨、骶骨、尾骨以及它們之間的骨連接一起構成骨盆。髖骨與股骨構成髖關節。`
  },
  {
    title: "股骨",
    desc: `股骨（femur）俗稱大腿骨（thigh bone），是人體中最長、最大的管狀骨，位於大腿，分為一體及上、下兩端。\n在四肢動物，位於下肢（或後肢）深面。股骨上端彎曲，此彎曲部稱作股骨頸（femoral neck）。\n這種彎曲連接能有效降低外界對骨盆的衝擊，股骨頸有如一緩衝器。股骨頸上方有股骨頭（femoral head），近圓形，其關節面與骨盆的髖臼形成髖關節。`
  },
  {
    title: "足部",
    desc: `跗骨（英語：Tarsus）指的是四足類動物足部七塊骨骼組成的短骨群，位於脛骨、腓骨、蹠骨之間。\n它由中足（骰骨、三個楔骨、足舟骨）和後足（距骨和跟骨）組成。\n跗骨與蹠骨形成關節，而蹠骨又與近端趾骨形成關節。\n在脛骨與腓骨之下和跗骨之上的關節稱為踝關節本體。\n人類最大的跗骨是跟骨，是位於足跟的負重骨骼。`
  }
];

/* 註冊 A-Frame 自訂組件，用於精確控管掃描事件與文字抽換 */
AFRAME.registerComponent('bone-target-handler', {
  schema: {
    index: { type: 'int', default: 0 }
  },
  init: function () {
    const el = this.el;
    // 將 index 資料安全地掛載在當前 DOM 的 dataset 中，防止非同步非預期覆蓋
    el.dataset.boneIndex = this.data.index;

    // 當圖片被成功識別時
    el.addEventListener("targetFound", (event) => {
      const currentIndex = event.target.dataset.boneIndex;
      const boneData = bones[currentIndex];
      
      if (boneData) {
        const infoCard = document.getElementById("infoCard");
        document.getElementById("title").innerText = boneData.title;
        document.getElementById("desc").innerText = boneData.desc;
        // 強制將 CSS 樣式設為 block 以顯示字卡
        infoCard.style.setProperty("display", "block", "important");
      }
    });

    // 當圖片離開相機視野、識別中斷時
    el.addEventListener("targetLost", () => {
      const infoCard = document.getElementById("infoCard");
      infoCard.style.setProperty("display", "none", "important");
    });
  }
});
</script>
</head>

<body>

<div class="info-card" id="infoCard">
  <h2 id="title"></h2>
  <p id="desc"></p>
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="alpha: true; antialias: true;"
>
  <a-assets>
    <img id="bone1" src="bone1.png" crossorigin="anonymous" />
    <img id="bone2" src="bone2.png" crossorigin="anonymous" />
    <img id="bone3" src="bone3.png" crossorigin="anonymous" />
    <img id="bone4" src="bone4.png" crossorigin="anonymous" />
    <img id="bone5" src="bone5.png" crossorigin="anonymous" />
    <img id="bone6" src="bone6.png" crossorigin="anonymous" />
    <img id="bone7" src="bone7.png" crossorigin="anonymous" />
    <img id="bone8" src="bone8.png" crossorigin="anonymous" />
    <img id="bone9" src="bone9.png" crossorigin="anonymous" />
  </a-assets>

  <a-light type="ambient" intensity="2"></a-light>
  <a-camera look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0" bone-target-handler="index: 0">
    <a-plane src="#bone1" width="1" height="1.2"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 1" bone-target-handler="index: 1">
    <a-plane src="#bone2" width="1" height="1.2"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 2" bone-target-handler="index: 2">
    <a-plane src="#bone3" width="1" height="1.2"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 3" bone-target-handler="index: 3">
    <a-plane src="#bone4" width="1" height="1.2"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 4" bone-target-handler="index: 4">
    <a-plane src="#bone5" width="1" height="1.2"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 5" bone-target-handler="index: 5">
    <a-plane src="#bone6" width="1" height="1.2"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 6" bone-target-handler="index: 6">
    <a-plane src="#bone7" width="1" height="1.2"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 7" bone-target-handler="index: 7">
    <a-plane src="#bone8" width="1" height="1.2"></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 8" bone-target-handler="index: 8">
    <a-plane src="#bone9" width="1" height="1.2"></a-plane>
  </a-entity>
</a-scene>

</body>
</html>
